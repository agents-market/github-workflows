# Production error → pull request. One file, one secret.
#
# The error comes from production: your Sentry, your own endpoint, or a
# repository_dispatch. The `error-autofix` pipeline says what is wrong and
# what to change; this file applies the change, writes the test, and opens the
# pull request for a human to approve.
#
# The one secret is MINIMAX_API_KEY. The token that opens the pull request is
# GITHUB_TOKEN, which GitHub gives the run — nothing to store, nothing to leak.
#
# One repository setting has to be on, or the fix lands as an issue instead of
# a pull request: Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests".
#
# The rules around the bot — one pull request per error class, a ceiling on
# open fixes — live in the script, where the checks can see them. The daily
# check that a merged fix stopped the error is `ai-error-autofix-watch.yml`.
name: AI Error Autofix

on:
  workflow_dispatch:
    inputs:
      error_report:
        description: 'The error as production produced it: message + stack trace.'
        required: true
        type: string
      repo_context:
        description: 'Optional: what the service is, which framework, the conventions to follow.'
        required: false
        type: string
        default: ''
      playbook_path:
        description: 'Optional: your file with the errors you already know about and the fix each of them gets.'
        required: false
        type: string
        default: '.error-playbook.json'
      maps_base_url:
        description: 'Optional: the URL your source maps are readable under. The map of a bundle is its own path with ".map" added.'
        required: false
        type: string
        default: ''
  # Your error reporter calls this:
  #   gh api repos/<owner>/<repo>/dispatches \
  #     -f event_type=production_error -f client_payload[error_report]='...'
  repository_dispatch:
    types: [production_error]

# Load-bearing, not decoration: a reusable workflow can only narrow the
# permissions it is given, so this file asks for exactly what it needs.
permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # The script that resolves the stack, applies the fix and opens the pull
  # request is fetched from our repository. `latest` is the newest revision
  # that passed the consumer smoke test. To pin it instead:
  #   gh api repos/agents-market/github-workflows/git/ref/tags/latest --jq .object.sha
  AI_AUTOFIX_REF: latest
  # The provider and the model are inputs of the pipeline, and the action runs
  # what the caller passes — it does not read a spec's declared defaults. These
  # two values go into the pipeline inputs, and the action's own `provider:` and
  # `model:` inputs below take them from the script's output, so the two
  # cannot disagree: the action registers one provider, and a stage that asks
  # for another one is refused. To run on another provider, change both values
  # here and give the step below that provider's key — the model must be one
  # the provider carries (minimax → MiniMax-M3, openrouter →
  # minimax/minimax-m3).
  PIPELINE_PROVIDER: minimax
  PIPELINE_MODEL: MiniMax-M3

jobs:
  fix:
    name: Fix the error
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      patch: ${{ steps.patch.outputs.patch }}
      branch: ${{ steps.patch.outputs.branch }}
      title: ${{ steps.patch.outputs.title }}
      body: ${{ steps.patch.outputs.body }}
      pr_ready: ${{ steps.patch.outputs.pr_ready }}
      signature: ${{ steps.patch.outputs.signature }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install agentsmarket CLI
        run: npm install -g @agentsmarket/cli@latest

      # The marketplace needs an identity to download from, and a runner has
      # none. `init` mints a throwaway key; it holds no money, and this
      # pipeline is free to download.
      - name: Mint throwaway agent identity
        run: |
          set -euo pipefail
          mkdir -p ~/.config/agentsmarket
          chmod 700 ~/.config/agentsmarket
          agentsmarket init
          chmod 600 ~/.config/agentsmarket/agent.key

      - name: Install the autofix pipeline
        id: install
        run: |
          set -euo pipefail
          agentsmarket pipeline install error-autofix
          # install writes <slug>@<resolved> even when no version was asked
          # for, and the action needs that concrete name. Read it back from
          # the lockfile rather than guessing.
          RESOLVED=$(python3 -c "
          import json
          lock = json.load(open('.agentsmarket/pipelines/pipeline.lock.yaml'))
          print(next(p['version'] for p in lock['pipelines'] if p['slug'] == 'error-autofix'))
          ")
          echo "path=.agentsmarket/pipelines/error-autofix@$RESOLVED/pipeline.yaml" >> "$GITHUB_OUTPUT"

      - name: Fetch the autofix script
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/agents-market/github-workflows/${AI_AUTOFIX_REF}/scripts/error-autofix.mjs" \
            -o "$RUNNER_TEMP/error-autofix.mjs"

      # The stack trace is resolved to files by code, not by the model: the
      # model is asked to fix code, not to find it. The rules for source maps
      # and for the consumer's playbook are in the script.
      - name: Resolve the stack to files
        id: sources
        env:
          ERROR_REPORT: ${{ inputs.error_report || github.event.client_payload.error_report }}
          REPO_CONTEXT: ${{ inputs.repo_context || github.event.client_payload.repo_context }}
          PLAYBOOK_FILE: ${{ inputs.playbook_path || github.event.client_payload.playbook_path || '.error-playbook.json' }}
          MAPS_BASE_URL: ${{ inputs.maps_base_url || vars.MAPS_BASE_URL }}
          MAPS_DIR: ${{ vars.MAPS_DIR }}
          MAPS_TOKEN: ${{ secrets.MAPS_TOKEN }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/error-autofix.mjs" sources "$GITHUB_WORKSPACE"

      - name: Run the autofix pipeline
        id: autofix
        uses: agents-market/pipeline-action@ca2c4905cfc36c33aa3e46af1288b55fc0189343 # v0.4.11 (merges the declared input defaults)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          provider: ${{ steps.sources.outputs.provider }}
          model: ${{ steps.sources.outputs.model }}
          inputs_json: ${{ steps.sources.outputs.inputs_json }}
          pipeline_file: ${{ steps.install.outputs.path }}

      # The fix is applied here, by code, from the snippets the pipeline
      # returned. The model does not write the patch and does not decide
      # whether the patch is good: it said what to replace and with what.
      - name: Apply the fix
        id: patch
        env:
          STAGE_OUTPUT: ${{ steps.autofix.outputs.stage_propose_fix_output }}
          RESULT_JSON: ${{ steps.autofix.outputs.result_json }}
          ERROR_REPORT: ${{ inputs.error_report || github.event.client_payload.error_report }}
          PLAYBOOK_JSON: ${{ steps.sources.outputs.playbook_json }}
          LOCATION_JSON: ${{ steps.sources.outputs.location_json }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/error-autofix.mjs" apply "$GITHUB_WORKSPACE"

      - name: Push the fix branch
        if: steps.patch.outputs.pr_ready == 'true'
        env:
          BRANCH: ${{ steps.patch.outputs.branch }}
          TITLE: ${{ steps.patch.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -q -m "$TITLE"
          # The branch is ours — it is named after the error — so a re-run of
          # the same error replaces it. `--force-with-lease` and not
          # `--force`: it refuses to overwrite a branch that moved under us.
          git push --force-with-lease origin "HEAD:$BRANCH"

  review:
    name: Review the fix
    needs: fix
    if: needs.fix.outputs.pr_ready == 'true'
    # The canonical review, called explicitly. A pull request opened by
    # GITHUB_TOKEN does not trigger the `pull_request` event — GitHub does not
    # run workflows for the token's own commits — so the review that guards
    # every other pull request would never run on this one.
    uses: agents-market/github-workflows/.github/workflows/ai-review.yml@latest
    with:
      code_diff: ${{ needs.fix.outputs.patch }}
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  publish:
    name: Open the pull request or the issue
    needs: [fix, review]
    # `always()`: a review that did not complete must not lose the fix, and a
    # fix that failed must still file the error somewhere. Both land below.
    # `skipped` is neither: there is no error to file.
    if: always() && needs.fix.result != 'cancelled' && needs.fix.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the autofix script
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/agents-market/github-workflows/${AI_AUTOFIX_REF}/scripts/error-autofix.mjs" \
            -o "$RUNNER_TEMP/error-autofix.mjs"

      # One pull request per error class, a ceiling on how many fixes may be
      # open at once, and — when the repository does not let GitHub Actions
      # create pull requests — an issue instead of a lost fix. The rules are
      # in the script, where the checks can see them.
      - name: Open a pull request
        if: needs.fix.outputs.pr_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.fix.outputs.branch }}
          TITLE: ${{ needs.fix.outputs.title }}
          BODY: ${{ needs.fix.outputs.body }}
          SIGNATURE: ${{ needs.fix.outputs.signature }}
          REVIEW_RESULT: ${{ needs.review.result }}
          MAX_OPEN_PRS: ${{ vars.MAX_OPEN_PRS || '3' }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/error-autofix.mjs" publish "$GITHUB_WORKSPACE"

      - name: Open an issue
        if: needs.fix.outputs.pr_ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: ${{ needs.fix.outputs.title || 'Error from production' }}
          BODY: ${{ needs.fix.outputs.body }}
          SIGNATURE: ${{ needs.fix.outputs.signature }}
          ERROR_REPORT: ${{ inputs.error_report || github.event.client_payload.error_report }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/error-autofix.mjs" report "$GITHUB_WORKSPACE"
