# Copy this file to `.github/workflows/ai-review.yml` and add one secret.
#
# Pin the full commit SHA, never a tag: a tag can move, a SHA cannot.
name: AI Code Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: agents-market/github-workflows/.github/workflows/ai-review.yml@<full-commit-sha>
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
