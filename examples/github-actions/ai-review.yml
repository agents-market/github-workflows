# Copy this file to .github/workflows/ai-review.yml in your repository and set
# one secret: MINIMAX_API_KEY.
#
# The provider is a pipeline input (`provider`, default minimax), so another
# provider is a different input value — pass it in `pipeline_inputs`. The model
# is the pipeline's own: the Action's `model` input does not override a stage
# that names its own model.
#
# Pin a full commit SHA, never a tag — a tag can move under you, a SHA cannot.
# To find the current one:
#   gh api repos/agents-market/github-workflows/commits/main --jq .sha
name: AI Code Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: agents-market/github-workflows/.github/workflows/ai-review.yml@<full-commit-sha>
    with:
      # Pin it. The workflow defaults to whatever is current, which is right for
      # the repository that owns the pipelines and wrong for yours: a PR check
      # that moves under you is not a check.
      pipeline_version: '3.1.0'
    secrets:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
