name: code-review-security-audit mock test
description: Valid diff produces deterministic mock findings with severity + CWE in mock mode.
pipeline: ./pipeline.yaml
mock: true
inputs:
  code_diff: "diff --git a/app.js b/app.js\n+const q = 'SELECT * FROM users WHERE id=' + req.params.id;\n+const pwd = 'hardcoded-secret';"
  language: javascript
  focus_area: security
  severity_threshold: medium
assertions:
  - type: exists
    # The stage emits `candidates`, not `findings` — it says so in its own
    # prompt, because the next stage drops the false positives and a rejected
    # lead must not be counted as a finding. This test never ran until
    # `agentsmarket pipeline test` was re-enabled, and it asserted a key the
    # pipeline never produced.
    path: pattern_scan.candidates
  - type: gte
    path: aggregate.summary.high_count
    value: 1
  - type: gte
    path: aggregate.summary.overall_risk_score
    value: 1
  - type: exists
    path: aggregate.recommendations
  - type: regex
    path: aggregate.markdown_report
    pattern: Mock report
