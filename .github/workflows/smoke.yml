# Proves the consumer wiring works with zero `with:` inputs — the thing
# workflows/ai-code-review.yml promises after the trim to 18 lines.
#
# It deliberately installs nothing: `pipeline call <slug>@<version> --local`
# downloads and runs in one command, which is the whole point of the shape
# VISION.md asks for. If this ever fails, the promise in the README is a lie.
name: Consumer smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The lowest CLI that passes this file. Both the version installed below and the
# guard on ai-review.yml read it, so the two can never disagree about it.
env:
  CLI_FLOOR: '0.12.4'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Runs first, and costs nothing. ai-review.yml never executes on a push to
      # main, so a file this consequential is otherwise only checked when someone
      # opens a pull request. All three breakages that actually happened here are
      # static — a dangling `env:`, the `env` context in a `uses:` step's `with:`,
      # a ref with a comment welded onto it — and this catches each one before it
      # reaches main rather than on the next PR.
      - name: Workflow files are structurally sound
        run: python3 .github/scripts/check-workflows.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The action is not pinned, so nothing here can go stale. What can break is the
      # ref itself: tag `v1` in that repo shipped an action.yml YAML that the
      # runner cannot parse, and nothing noticed for three weeks. This asserts the
      # ref resolves to something loadable — manifest parses, entrypoint exists.
      - name: The action ref we use is a loadable action
        run: |
          set -euo pipefail
          REPO=agents-market/pipeline-action
          # Read the ref the way the runner does — parsed, not grepped. A grep for
          # `pipeline-action@<ref>` stops at the first space, so a ref with a
          # stray comment glued onto it parses as valid and then fails to resolve
          # in every job at once. That happened here, and this check passed it.
          REF=$(python3 -c "
          import yaml
          d = yaml.safe_load(open('.github/workflows/ai-review.yml'))
          for j in d['jobs'].values():
              for s in j.get('steps', []):
                  u = str(s.get('uses', ''))
                  if u.startswith('agents-market/pipeline-action@'):
                      ref = u.split('@', 1)[1]
                      assert ref and not any(c.isspace() for c in ref), f'glued onto the ref: {u!r}'
                      print(ref); raise SystemExit
          raise SystemExit('no pipeline-action step found in ai-review.yml')
          ")
          D=$(mktemp -d)
          gh api "repos/$REPO/contents/action.yml?ref=$REF" --jq .content | base64 -d > "$D/action.yml"
          gh api "repos/$REPO/contents/dist/index.js?ref=$REF" --jq .size > "$D/dist-size"
          python3 - "$D" "$REF" <<'PY'
          import pathlib, sys, yaml
          d = pathlib.Path(sys.argv[1])
          spec = yaml.safe_load((d / "action.yml").read_text())
          runs = spec.get("runs") or {}
          assert runs.get("main"), f"action.yml has no runs.main: {runs}"
          size = (d / "dist-size").read_text().strip()
          assert size.isdigit(), f"dist/index.js is not a readable file at {sys.argv[2]}"
          print(f"{sys.argv[2]}: {len(spec.get('inputs') or {})} inputs, runs {runs['main']}, dist {size} bytes")
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      # The floor keeps proving that the oldest CLI we support still works.
      # ai-review.yml installs @latest instead, so the two together say how far
      # the published CLI has moved. Installing the floor IS the proof that it
      # is published; there is nothing left for a separate assertion to check.
      - name: Install CLI floor
        run: |
          npm install -g @agentsmarket/cli@${{ env.CLI_FLOOR }}
          echo "floor=${{ env.CLI_FLOOR }} latest=$(npm view @agentsmarket/cli version)"

      # Downloading from the marketplace is an authenticated request, so a
      # runner needs an identity. Without this the one command fails with
      # "Not in the marketplace either", which is what the first run of this
      # workflow actually did.
      - name: Mint throwaway agent identity
        run: |
          set -euo pipefail
          mkdir -p ~/.config/agentsmarket
          chmod 700 ~/.config/agentsmarket
          agentsmarket init
          chmod 600 ~/.config/agentsmarket/agent.key

      - name: One command, no install step
        run: |
          agentsmarket pipeline call style-review@2.0.4 --local --mock \
            --inputs '{"code_diff":"diff --git a/a.ts b/a.ts\n+const x = 1;"}'

      - name: The same with the v-prefixed version
        run: |
          agentsmarket pipeline call code-review-security-audit@v2.0.4 --local --mock \
            --inputs '{"code_diff":"diff --git a/a.ts b/a.ts\n+const x = 1;"}'
