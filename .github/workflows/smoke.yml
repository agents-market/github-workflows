# Proves the consumer wiring works with zero `with:` inputs — the thing
# workflows/ai-code-review.yml promises after the trim to 18 lines.
#
# It deliberately installs nothing: `pipeline call <slug>@<version> --local`
# downloads and runs in one command, which is the whole point of the shape
# VISION.md asks for. If this ever fails, the promise in the README is a lie.
#
# Two kinds of pipeline, two different answers, and the test says which is
# which instead of pretending:
#
#   * A free pipeline (price_usdc: 0 — ours, the public ones) installs and
#     runs with a throwaway identity that holds no funds. This is the promise
#     on the website, so it is the promise the test proves.
#   * A paid pipeline costs money to download, and the identity has to hold
#     money. The test asserts that the marketplace says so clearly, because a
#     bare "402" in a consumer's face is not a promise, it is an obstacle.
name: Consumer smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The lowest CLI that passes this file. Both the version installed below and the
# guard on ai-review.yml read it, so the two can never disagree about it.
#
# 0.12.5, not 0.12.4: release 3.3.2 of the audit took its provider from an
# input (`provider: ${input.provider}`), and 0.12.4 reads that field literally
# and refuses to install: "Provider '${input.provider}' is not registered".
# 0.12.5 resolves input references there. The current releases do not need it,
# but the floor does not go back under a release that is still in the catalogue.
env:
  CLI_FLOOR: '0.12.5'

  # The free public pipeline this repository publishes, and the version the
  # test pins. `pipeline info` in the job below refuses to guess: a version
  # that is not published fails the test loudly, instead of quietly installing
  # whatever the catalogue happens to serve.
  FREE_PIPELINE: 'code-review-security-audit'
  FREE_VERSION: '3.3.3'

  # A pipeline that is actually paid. It stays priced at 1000 USDC on purpose —
  # it is what proves the paid path is real and what the consumer is told when
  # they hit it.
  #
  # Not one of the two flagships: those are free to download by decision, and
  # the price a pipeline carries is the price of its current version. When
  # style-review was repriced to free, every one of its old versions followed
  # it down to zero — and this test, which pinned style-review@2.0.4 as "a paid
  # pipeline", began asserting that a free install fails. It failed for the
  # right reason on the wrong premise. The four other pipelines in this
  # repository are priced at 1000 USDC and stay that way.
  PAID_PIPELINE: 'dependency-scanner'
  PAID_VERSION: '2.0.11'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Runs first, and costs nothing. ai-review.yml never executes on a push to
      # main, so a file this consequential is otherwise only checked when someone
      # opens a pull request. All three breakages that actually happened here are
      # static — a dangling `env:`, the `env` context in a `uses:` step's `with:`,
      # a ref with a comment welded onto it — and this catches each one before it
      # reaches main rather than on the next PR.
      - name: Workflow files are structurally sound
        run: python3 .github/scripts/check-workflows.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The action is not pinned, so nothing here can go stale. What can break is the
      # ref itself: tag `v1` in that repo shipped an action.yml YAML that the
      # runner cannot parse, and nothing noticed for three weeks. This asserts the
      # ref resolves to something loadable — manifest parses, entrypoint exists.
      - name: The action ref we use is a loadable action
        run: |
          set -euo pipefail
          REPO=agents-market/pipeline-action
          # Read the ref the way the runner does — parsed, not grepped. A grep for
          # `pipeline-action@<ref>` stops at the first space, so a ref with a
          # stray comment glued onto it parses as valid and then fails to resolve
          # in every job at once. That happened here, and this check passed it.
          REF=$(python3 -c "
          import yaml
          d = yaml.safe_load(open('.github/workflows/ai-review.yml'))
          for j in d['jobs'].values():
              for s in j.get('steps', []):
                  u = str(s.get('uses', ''))
                  if u.startswith('agents-market/pipeline-action@'):
                      ref = u.split('@', 1)[1]
                      assert ref and not any(c.isspace() for c in ref), f'glued onto the ref: {u!r}'
                      print(ref); raise SystemExit
          raise SystemExit('no pipeline-action step found in ai-review.yml')
          ")
          D=$(mktemp -d)
          gh api "repos/$REPO/contents/action.yml?ref=$REF" --jq .content | base64 -d > "$D/action.yml"
          gh api "repos/$REPO/contents/dist/index.js?ref=$REF" --jq .size > "$D/dist-size"
          python3 - "$D" "$REF" <<'PY'
          import pathlib, sys, yaml
          d = pathlib.Path(sys.argv[1])
          spec = yaml.safe_load((d / "action.yml").read_text())
          runs = spec.get("runs") or {}
          assert runs.get("main"), f"action.yml has no runs.main: {runs}"
          size = (d / "dist-size").read_text().strip()
          assert size.isdigit(), f"dist/index.js is not a readable file at {sys.argv[2]}"
          print(f"{sys.argv[2]}: {len(spec.get('inputs') or {})} inputs, runs {runs['main']}, dist {size} bytes")
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      # The floor keeps proving that the oldest CLI we support still works.
      # ai-review.yml installs @latest instead, so the two together say how far
      # the published CLI has moved. Installing the floor IS the proof that it
      # is published; there is nothing left for a separate assertion to check.
      - name: Install CLI floor
        run: |
          npm install -g @agentsmarket/cli@${{ env.CLI_FLOOR }}
          echo "floor=${{ env.CLI_FLOOR }} latest=$(npm view @agentsmarket/cli version)"

      # Downloading from the marketplace is an authenticated request, so a
      # runner needs an identity. Without this the one command fails with
      # "Not in the marketplace either", which is what the first run of this
      # workflow actually did.
      - name: Mint throwaway agent identity
        run: |
          set -euo pipefail
          mkdir -p ~/.config/agentsmarket
          chmod 700 ~/.config/agentsmarket
          agentsmarket init
          chmod 600 ~/.config/agentsmarket/agent.key

      # The free pipeline is the promise the website makes: one command, no
      # install, no money. The identity here was minted seconds ago and holds
      # nothing, so if this passes, "public and free" is literally true.
      - name: One command, no install step (free pipeline, unfunded identity)
        run: |
          agentsmarket pipeline call "$FREE_PIPELINE@$FREE_VERSION" --local --mock \
            --inputs '{"code_diff":"diff --git a/a.ts b/a.ts\n+const x = 1;"}'

      - name: The same with the v-prefixed version
        run: |
          agentsmarket pipeline call "$FREE_PIPELINE@v$FREE_VERSION" --local --mock \
            --inputs '{"code_diff":"diff --git a/a.ts b/a.ts\n+const x = 1;"}'

      # The paid path. It must fail, and it must fail with a reason a consumer
      # can act on: the marketplace answers a download it wants paid for with
      # 402 and the price. If the CLI ever swallows that and prints "not
      # found", the consumer is left guessing — so the build fails when the
      # message stops being honest.
      - name: A paid pipeline says what it costs
        run: |
          # `if`, not `$(...)` then `$?`: the runner executes this file with
          # `bash -e`, so a command that fails outside a condition takes the
          # whole script with it — and the exit code we came here to look at
          # is exactly the one that was never read.
          if out=$(agentsmarket pipeline call "$PAID_PIPELINE@$PAID_VERSION" --local --mock \
            --inputs '{"code_diff":"diff --git a/a.ts b/a.ts\n+const x = 1;"}' 2>&1); then
            code=0
          else
            code=$?
          fi
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::$PAID_PIPELINE@$PAID_VERSION is a paid pipeline and it just installed for free — either the price is gone or the payment gate is broken. Both are release blockers."
            exit 1
          fi
          echo "$out" | grep -qiE '402|payment|price|usdc' || {
            echo "::error::the paid pipeline failed, but the message does not say why. A consumer has to be told that the download costs money, not shown 'not found'."
            exit 1
          }
          echo "::notice::a paid pipeline is not free to download. The identity above was minted seconds ago and holds no funds, so the marketplace answered 402. A consumer of a paid pipeline needs a funded identity; the price of every download is in the catalogue."
          echo "  the paid pipeline refused an unfunded identity, and said so"
