# Proves the consumer wiring works with zero `with:` inputs — the thing
# workflows/ai-code-review.yml promises after the trim to 18 lines.
#
# It deliberately installs nothing: `pipeline call <slug>@<version> --local`
# downloads and runs in one command, which is the whole point of the shape
# VISION.md asks for. If this ever fails, the promise in the README is a lie.
name: Consumer smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Dogfooding that trails the proven floor is worse than none: this file
      # proves the one command works on CLI N, then every PR in this repo is
      # reviewed on an older one, so the thing being exercised is not the thing
      # consumers install. It happened — ai-review.yml sat on 0.11.2, which
      # pulls runtime 0.5.0, which predates stage.maxTokens. Every dogfooded run
      # was exercising the exact truncation this repository exists to fix.
      - name: Dogfooding CLI is not behind the proven floor
        run: |
          set -euo pipefail
          FLOOR=$(grep -oE '@agentsmarket/cli@[0-9]+\.[0-9]+\.[0-9]+' "$GITHUB_WORKFLOW_PATH" | head -1 | grep -oE '[0-9.]+$')
          DOG=$(grep -oE "CLI_VERSION: '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/ai-review.yml | grep -oE '[0-9.]+')
          [ -n "$FLOOR" ] && [ -n "$DOG" ] || { echo "::error::could not read a CLI pin from either workflow"; exit 1; }
          LOW=$(printf '%s\n%s\n' "$DOG" "$FLOOR" | sort -V | head -1)
          if [ "$DOG" != "$FLOOR" ] && [ "$LOW" = "$DOG" ]; then
            echo "::error::ai-review.yml dogfoods on CLI $DOG but smoke.yml proves $FLOOR. Raise CLI_VERSION in ai-review.yml."
            exit 1
          fi
          echo "dogfood CLI $DOG is not behind floor $FLOOR"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install CLI
        run: npm install -g @agentsmarket/cli@0.12.4

      # Downloading from the marketplace is an authenticated request, so a
      # runner needs an identity. Without this the one command fails with
      # "Not in the marketplace either", which is what the first run of this
      # workflow actually did.
      - name: Mint throwaway agent identity
        run: |
          set -euo pipefail
          mkdir -p ~/.config/agentsmarket
          chmod 700 ~/.config/agentsmarket
          agentsmarket init
          chmod 600 ~/.config/agentsmarket/agent.key

      - name: One command, no install step
        run: |
          agentsmarket pipeline call style-review@2.0.4 --local --mock \
            --inputs '{"code_diff":"diff --git a/a.ts b/a.ts\n+const x = 1;"}'

      - name: The same with the v-prefixed version
        run: |
          agentsmarket pipeline call code-review-security-audit@v2.0.4 --local --mock \
            --inputs '{"code_diff":"diff --git a/a.ts b/a.ts\n+const x = 1;"}'
