# pipeline-action CI/CD for github-workflows repo
# Detects changed pipelines, bumps version, publishes to agentsmarket marketplace.

name: publish-pipeline

on:
  push:
    branches: [main]
    paths:
      - 'pipelines/**'
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline slug to publish (e.g., style-review). Empty = all changed pipelines.'
        required: false
        type: string
      bump:
        description: 'Version bump type (overrides auto-detect)'
        required: false
        type: choice
        options: [auto, patch, minor, major]
        default: 'auto'

permissions:
  contents: write
  pull-requests: read

env:
  # Pinned explicitly: `npx @agentsmarket/cli` without a version pulls
  # latest, and a release once shipped an unpublished dependency (E404).
  CLI_VERSION: '0.12.4'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'agents-market/github-workflows'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect changed pipelines
        id: detect
        run: |
          if [ -n "${{ inputs.pipeline }}" ]; then
            CHANGED="${{ inputs.pipeline }}"
          else
            # github.event.before, not HEAD~1: a push of three commits moves
            # HEAD~1 past the first two, and those pipelines would never
            # publish. Falls back to HEAD~1 for a manual re-run.
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            # README.md as well as pipeline.yaml: the README frontmatter becomes
            # the marketplace listing and ships inside the bundle, so a
            # README-only fix has to republish. #23 corrected two README
            # versions and this detection missed it — the run succeeded having
            # published nothing.
            CHANGED=$(git diff --name-only "$BASE" HEAD \
                -- 'pipelines/*/pipeline.yaml' 'pipelines/*/README.md' \
              | xargs -r -I {} dirname {} | xargs -r -I {} basename {} \
              | sort -u | tr '\n' ',' | sed 's/,$//')
            if [ -z "$CHANGED" ]; then
              echo "No pipeline changes detected"
              echo "changed=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Pipelines to publish: $CHANGED"

      # `pipeline test` is disabled in the CLI for 0.10.0, so nothing in this
      # repo has ever run the test.yaml files. This gate is the only thing
      # standing between a malformed pipeline.yaml and the public catalogue.
      - name: Validate every changed pipeline
        if: steps.detect.outputs.changed != ''
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          IFS=',' read -ra PIPELINES <<< "${{ steps.detect.outputs.changed }}"
          for SLUG in "${PIPELINES[@]}"; do
            echo "::group::Validating $SLUG"
            [ -f "pipelines/$SLUG/README.md" ] || {
              echo "::error::pipelines/$SLUG/README.md is missing — publish needs it for the listing"
              exit 1
            }

            # The README frontmatter ships to consumers inside the installed
            # bundle and becomes the marketplace listing, so a version that
            # disagrees with pipeline.yaml is a lie told in two places: the page
            # says one version, `install <slug>@<version>` accepts another.
            # style-review and code-review-security-audit sat at 2.0.3 with
            # READMEs still declaring 1.0.0 from the September pilot.
            SPEC_VERSION=$(grep -m1 -E '^version:' "pipelines/$SLUG/pipeline.yaml" | tr -d ' \r' | cut -d: -f2)
            README_VERSION=$(grep -m1 -E '^version:' "pipelines/$SLUG/README.md" | tr -d ' \r' | cut -d: -f2)
            if [ "$SPEC_VERSION" != "$README_VERSION" ]; then
              echo "::error::pipelines/$SLUG declares version $SPEC_VERSION in pipeline.yaml but $README_VERSION in README.md. The README frontmatter is what the marketplace listing shows and what consumers receive in the bundle — they must agree."
              exit 1
            fi

            npx @agentsmarket/cli@${CLI_VERSION} validate "pipelines/$SLUG/pipeline.yaml"
            echo "::endgroup::"
          done

      - name: Publish each pipeline
        if: steps.detect.outputs.changed != ''
        env:
          # The CLI ignores AGENTSMARKET_PRIVATE_KEY: loadConfig() looks for a
          # config dir first, and in CI there is none, so publishing failed with
          # "Agent not initialized". Treasury mode reads the key straight from the
          # environment, which is what a stateless runner needs.
          AGENTSMARKET_TREASURY_KEY: ${{ secrets.PUBLISH_KEY }}
        run: |
          set -euo pipefail
          IFS=',' read -ra PIPELINES <<< "${{ steps.detect.outputs.changed }}"
          for SLUG in "${PIPELINES[@]}"; do
            echo "::group::Publishing $SLUG"
            npx @agentsmarket/cli@${CLI_VERSION} pipeline publish \
              "pipelines/$SLUG/pipeline.yaml" \
              --readme "pipelines/$SLUG/README.md" \
              --bump-version "${{ inputs.bump || 'patch' }}" | tee "/tmp/$SLUG.log"
            echo "::endgroup::"
          done

      # The CLI bumps the version in the POST body only — it never writes it
      # back to the file. Without this the repo keeps declaring 2.0.1 while
      # the catalogue serves 2.1.0, and the next publish bumps from a version
      # that no longer exists. [skip ci] is load-bearing: the write touches
      # pipelines/**, which is this workflow's own trigger.
      - name: Write published versions back
        if: steps.detect.outputs.changed != ''
        run: |
          set -euo pipefail
          IFS=',' read -ra PIPELINES <<< "${{ steps.detect.outputs.changed }}"
          for SLUG in "${PIPELINES[@]}"; do
            NEW=$(grep -oE 'Version: +[0-9]+\.[0-9]+\.[0-9]+' "/tmp/$SLUG.log" | tail -1 | grep -oE '[0-9.]+$' || true)
            [ -n "$NEW" ] || { echo "  $SLUG: no Version: line, leaving file alone"; continue; }
            FILE="pipelines/$SLUG/pipeline.yaml"
            CUR=$(grep -m1 -E '^version:' "$FILE" | grep -oE '[0-9.]+')
            if [ "$NEW" = "$CUR" ]; then
              echo "  $SLUG: already $NEW, nothing to write"
              continue
            fi
            sed -i -E "s/^version: .*/version: $NEW/" "$FILE"
            sed -i -E "s/^version: .*/version: $NEW/" "pipelines/$SLUG/README.md" 2>/dev/null || true
            git add "$FILE" "pipelines/$SLUG/README.md" 2>/dev/null || git add "$FILE"
            echo "  $SLUG: $CUR -> $NEW"
          done

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore(pipelines): record published versions [skip ci]"
          git push -q origin HEAD:${{ github.ref_name }}
