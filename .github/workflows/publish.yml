# pipeline-action CI/CD for github-workflows repo
# Detects changed pipelines, bumps version, publishes to agentsmarket marketplace.

name: publish-pipeline

on:
  push:
    branches: [main]
    paths:
      - 'pipelines/**'
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline slug to publish (e.g., style-review). Empty = all changed pipelines.'
        required: false
        type: string
      bump:
        # `patch`, not `auto`. The publish step passes
        #   --bump-version "${{ inputs.bump || 'patch' }}"
        # and `'auto'` is non-empty, so it wins that fallback and the CLI is handed a
        # level it does not know. `bumpSemver` (cli/src/lib/semver-bump.ts:34) has
        # cases for `patch`, `minor` and `major` and a `default: return null`, so it
        # returned null and the run died on the very first pipeline:
        #   Cannot bump version "2.0.1" — it is not X.Y.Z.
        #   CONTENT_CHANGED_SAME_VERSION: pipeline 'api-design-reviewer' v2.0.1
        # Nothing ever implemented auto-detect, so `auto` was an option that could
        # only fail. It stayed invisible on push, where `inputs.bump` is empty and the
        # fallback applies — only `workflow_dispatch` hit it, which is how the four
        # pipelines stranded by the failed `ae35566` run turned out to be still
        # exactly where they were.
        description: 'Version bump type'
        required: false
        type: choice
        options: [patch, minor, major]
        default: 'patch'

permissions:
  contents: write
  pull-requests: read

env:
  # Pinned explicitly: `npx @agentsmarket/cli` without a version pulls
  # latest, and a release once shipped an unpublished dependency (E404).
  CLI_VERSION: '0.12.5'
  # Job-level, because each `run:` is its own shell. Defining MARKER inside the
  # detect step meant the write-back step — which needs the same path — saw an
  # empty variable, `echo sha > ""` failed, and the step died before committing
  # anything. Every publish since then went unrecorded, so the repository sat a
  # full version behind the catalogue on all six pipelines with nothing to say so.
  PUBLISH_MARKER: .github/last-published-sha   # ships the ${input.X} fix in stage.provider/model;
                           # 0.12.4 rejects provider: ${input.provider} at validation

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'agents-market/github-workflows'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect changed pipelines
        id: detect
        run: |
          if [ -n "${{ inputs.pipeline }}" ]; then
            CHANGED="${{ inputs.pipeline }}"
          else
            # github.event.before, not HEAD~1: a push of three commits moves
            # HEAD~1 past the first two, and those pipelines would never
            # publish. Falls back to HEAD~1 for a manual re-run.
            #
            # `github.event.before` is still wrong whenever a publish fails. On 19
            # October the run for ae35566 died on CONTENT_CHANGED_SAME_VERSION, and
            # the next push's diff contained only the two pipelines that commit also
            # touched — so the four whose prompts changed in ae35566 looked untouched
            # and were never published, with nothing anywhere saying so. Three
            # publishes failed here for one reason or another, and each one stranded
            # everything it had changed.
            #
            # So the base is the last commit that actually published, recorded by the
            # write-back step. Falling back to `github.event.before` keeps the first
            # run working, and HEAD~1 keeps a manual re-run working.
            MARKER="$PUBLISH_MARKER"
            BASE=""
            if [ -f "$MARKER" ]; then
              BASE=$(tr -d ' \n' < "$MARKER")
            fi
            if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="${{ github.event.before }}"
            fi
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            echo "base commit: ${BASE} (last successful publish)"
            # README.md as well as pipeline.yaml: the README frontmatter becomes
            # the marketplace listing and ships inside the bundle, so a
            # README-only fix has to republish. #23 corrected two README
            # versions and this detection missed it — the run succeeded having
            # published nothing.
            # --diff-filter=d: a deleted path is still a path. Removing a file from a
            # pipeline — or deleting the fixture README that briefly sat under
            # one — listed the old path, the detector read its directory as a
            # pipeline named after that directory, and the job failed at
            # validation for a pipeline that does not exist.
            CHANGED=$(git diff --name-only --diff-filter=d "$BASE" HEAD \
                -- 'pipelines/*/pipeline.yaml' 'pipelines/*/README.md' \
              | xargs -r -I {} dirname {} | xargs -r -I {} basename {} \
              | sort -u | tr '\n' ',' | sed 's/,$//')
              # A version bump alone is not a content change. The write-back below rewrites
              # `version:` to match the catalogue, so the next detector reads the write-back's
              # own commit as a change to every pipeline and republishes them all — measured:
              # one commit moving six version lines republished all six and bumped all six,
              # which is a version treadmill rather than an update. A file whose only changed
              # lines are `version:` / `# version:` carries no new behaviour, so skip it.
              FILTERED=""
              IFS=',' read -ra CANDIDATES <<< "$CHANGED"
              for SLUG in "${CANDIDATES[@]}"; do
                BODY=$(git diff -U0 "$BASE" HEAD -- "pipelines/$SLUG/" \
                  | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                  | grep -vE '^[+-][[:space:]]*#?[[:space:]]*version:[[:space:]]*[0-9]' || true)
                if [ -z "$BODY" ]; then
                  echo "$SLUG: only version lines changed since $BASE — not a content change, skipping"
                  continue
                fi
                FILTERED="${FILTERED:+$FILTERED,}$SLUG"
              done
              CHANGED="$FILTERED"
              if [ -z "$CHANGED" ]; then
                echo "No pipeline content changes detected"
                echo "changed=" >> "$GITHUB_OUTPUT"
                exit 0
                fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Pipelines to publish: $CHANGED"

      # `pipeline test` is disabled in the CLI for 0.10.0, so nothing in this
      # repo has ever run the test.yaml files. This gate is the only thing
      # standing between a malformed pipeline.yaml and the public catalogue.
      - name: Validate every changed pipeline
        if: steps.detect.outputs.changed != ''
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          IFS=',' read -ra PIPELINES <<< "${{ steps.detect.outputs.changed }}"

          # A version must only ever go up. The sibling repository publishing
          # pipeline-action has this exact disease today: tag `v1.0.0` is dated
          # 17 September while `v0.4.4` is 2 October, and `releases/latest`
          # answers `v0.4.3`. "Take the highest version" and "take the newest
          # release" return different, both-wrong answers. Nothing in a pipeline
          # catalogue should be able to reproduce that, so a version that went
          # backwards fails here rather than in a consumer's install command.
          for SLUG in "${PIPELINES[@]}"; do
            FILE="pipelines/$SLUG/pipeline.yaml"
            WAS=$(git show "HEAD~1:$FILE" 2>/dev/null \
                  | grep -m1 -E '^version:' | tr -d ' \r' | cut -d: -f2 || true)
            NOW=$(grep -m1 -E '^version:' "$FILE" | tr -d ' \r' | cut -d: -f2)
            [ -z "$WAS" ] && continue
            LOW=$(printf '%s\n%s\n' "$NOW" "$WAS" | sort -V | head -1)
            if [ "$LOW" = "$NOW" ] && [ "$NOW" != "$WAS" ]; then
              echo "::error::$SLUG version went backwards: $WAS -> $NOW. Consumers pinning $WAS would silently keep the old pipeline."
              exit 1
            fi
            echo "$SLUG: $WAS -> $NOW"
          done

          # The version lives twice and only one copy is authoritative, which is
          # exactly why they drifted. `pipeline publish` reads the commented
          # header (`# version:`), because `extractMetadata` parses the leading
          # comment block and stops at the first real field; `validate`, the
          # marketplace listing and every check here read the `version:` field.
          # On 19 October the header said 2.0.3 while the field said 2.0.4, so the
          # bump computed 2.0.3 -> 2.0.4, republished a version that already
          # existed, and the run died on CONTENT_CHANGED_SAME_VERSION.
          #
          # A pipeline whose two versions disagree has no correct behaviour, so
          # refuse it here rather than publish whichever one the drift hits.
          for SLUG in "${PIPELINES[@]}"; do
            FIELD=$(grep -m1 -E '^version:' "pipelines/$SLUG/pipeline.yaml" | tr -d ' \r' | cut -d: -f2)
            HEAD_V=$(grep -m1 -E '^#[[:space:]]*version:' "pipelines/$SLUG/pipeline.yaml" \
                     | tr -d ' \r' | sed -E 's/^#[[:space:]]*version:[[:space:]]*//')
            if [ "$FIELD" != "$HEAD_V" ]; then
              echo "::error::$SLUG carries two versions: field '$FIELD', commented header '$HEAD_V'. The CLI bumps the header and everything else reads the field, so publishing would fail or publish the wrong one."
              exit 1
            fi
          done

          for SLUG in "${PIPELINES[@]}"; do
            echo "::group::Validating $SLUG"
            [ -f "pipelines/$SLUG/README.md" ] || {
              echo "::error::pipelines/$SLUG/README.md is missing — publish needs it for the listing"
              exit 1
            }

            # The README frontmatter ships to consumers inside the installed
            # bundle and becomes the marketplace listing, so a version that
            # disagrees with pipeline.yaml is a lie told in two places: the page
            # says one version, `install <slug>@<version>` accepts another.
            # style-review and code-review-security-audit sat at 2.0.3 with
            # READMEs still declaring 1.0.0 from the September pilot.
            SPEC_VERSION=$(grep -m1 -E '^version:' "pipelines/$SLUG/pipeline.yaml" | tr -d ' \r' | cut -d: -f2)
            README_VERSION=$(grep -m1 -E '^version:' "pipelines/$SLUG/README.md" | tr -d ' \r' | cut -d: -f2)
            if [ "$SPEC_VERSION" != "$README_VERSION" ]; then
              echo "::error::pipelines/$SLUG declares version $SPEC_VERSION in pipeline.yaml but $README_VERSION in README.md. The README frontmatter is what the marketplace listing shows and what consumers receive in the bundle — they must agree."
              exit 1
            fi

            npx @agentsmarket/cli@${CLI_VERSION} validate "pipelines/$SLUG/pipeline.yaml"
            echo "::endgroup::"
          done

      - name: Publish each pipeline
        if: steps.detect.outputs.changed != ''
        env:
          # The CLI ignores AGENTSMARKET_PRIVATE_KEY: loadConfig() looks for a
          # config dir first, and in CI there is none, so publishing failed with
          # "Agent not initialized". Treasury mode reads the key straight from the
          # environment, which is what a stateless runner needs.
          AGENTSMARKET_TREASURY_KEY: ${{ secrets.PUBLISH_KEY }}
        run: |
          set -euo pipefail
          IFS=',' read -ra PIPELINES <<< "${{ steps.detect.outputs.changed }}"
          for SLUG in "${PIPELINES[@]}"; do
            echo "::group::Publishing $SLUG"
            npx @agentsmarket/cli@${CLI_VERSION} pipeline publish \
              "pipelines/$SLUG/pipeline.yaml" \
              --readme "pipelines/$SLUG/README.md" \
              --bump-version "${{ inputs.bump || 'patch' }}" | tee "/tmp/$SLUG.log"
            echo "::endgroup::"
          done

      # The CLI bumps the version in the POST body only — it never writes it
      # back to the file. Without this the repo keeps declaring 2.0.1 while
      # the catalogue serves 2.1.0, and the next publish bumps from a version
      # that no longer exists. [skip ci] is load-bearing: the write touches
      # pipelines/**, which is this workflow's own trigger.
      - name: Write published versions back
        if: steps.detect.outputs.changed != ''
        run: |
          set -euo pipefail
          IFS=',' read -ra PIPELINES <<< "${{ steps.detect.outputs.changed }}"
          for SLUG in "${PIPELINES[@]}"; do
            # Two shapes, and only the first was ever read. A real publish prints
            # `Version: X.Y.Z`; the dedup path prints
            #   `Already published (unchanged): <name> vX.Y.Z`
            # with no Version line at all. Reading only the first meant an unchanged
            # publish left the repository's version behind the catalogue's.
            NEW=$(grep -oE '(Version: +[0-9]+\.[0-9]+\.[0-9]+|Already published \(unchanged\): [^ ]+ v[0-9]+\.[0-9]+\.[0-9]+)' \
                  "/tmp/$SLUG.log" | tail -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$' || true)
            [ -n "$NEW" ] || { echo "  $SLUG: no version in CLI output, leaving file alone"; continue; }
            FILE="pipelines/$SLUG/pipeline.yaml"
            CUR=$(grep -m1 -E '^version:' "$FILE" | grep -oE '[0-9.]+')
            if [ "$NEW" = "$CUR" ]; then
              echo "  $SLUG: already $NEW, nothing to write"
              continue
            fi
            sed -i -E "s/^version: .*/version: $NEW/" "$FILE"
            # The commented header too. Writing only the field is what let the two
            # drift a full version apart: the CLI kept bumping a header nobody
            # updated, until it republished a version that already existed.
            sed -i -E "s/^#[[:space:]]*version: .*/# version: $NEW/" "$FILE"
            sed -i -E "s/^version: .*/version: $NEW/" "pipelines/$SLUG/README.md" 2>/dev/null || true
            git add "$FILE" "pipelines/$SLUG/README.md" 2>/dev/null || git add "$FILE"
            echo "  $SLUG: $CUR -> $NEW"
          done

          # Record what was published, so the next detector can start from here rather
          # than from the previous commit. Without this, any failed publish
          # strands every change it contained and nothing reports that.
          echo "${{ github.sha }}" > "$PUBLISH_MARKER"
          git add "$PUBLISH_MARKER"

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore(pipelines): record published versions [skip ci]"
          # Rebase before pushing. A push landing between this job's checkout and
          # its push made the push non-fast-forward and the step fail — measured,
          # and the expensive way: the pipelines published, the run went red on
          # "Note about fast-forwards", and the record of the published versions
          # was lost. One fetch costs less than losing it. A rebase conflict fails
          # the step rather than rewriting a shared branch.
          git fetch -q origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push -q origin HEAD:${{ github.ref_name }}
