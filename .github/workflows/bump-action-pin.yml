# Keeps the pipeline-action SHA in ai-review.yml current, so it never drifts
# three weeks behind the action we publish ourselves.
#
# The guard in smoke.yml only complains. This fixes it: daily, it opens a PR
# that moves every occurrence of the pin to the newest release. That PR runs the
# full dogfooding suite against the new pin, so the thing that proves the bump is
# safe is the same check that would have caught a bad one — a bump that breaks the
# action turns its own PR red instead of merging and breaking every PR review.
#
# Manual bumps stay legitimate: the guard passes when the pin is ahead of the
# newest release, so pinning main HEAD by choice does not fight this.
name: Keep the pipeline-action pin fresh

on:
  # 06:17 UTC daily. Off the top of the hour on purpose: every workflow in every
  # repository is scheduled at :00, and GitHub delays the crowded ones.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One bump at a time. If yesterday's PR is still open, this is the same change
# and a second branch would duplicate it.
concurrency:
  group: bump-action-pin
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compare the pin with the newest release
        id: resolve
        run: |
          set -euo pipefail
          PIN=$(grep -oE "pipeline-action@[0-9a-f]{40}" .github/workflows/ai-review.yml \
                | head -1 | cut -d@ -f2)
          [ -n "$PIN" ] || { echo "::error::no pipeline-action SHA pin in ai-review.yml"; exit 1; }
          NEW=$(.github/scripts/newest-action-release.sh)
          STATUS=$(gh api "repos/agents-market/pipeline-action/compare/$NEW...$PIN" --jq .status)
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "pin=$PIN newest=$NEW compare=$STATUS"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Already current
        if: steps.resolve.outputs.status != 'behind'
        run: echo "pin ${{ steps.resolve.outputs.pin }} is not behind the newest release — nothing to do"

      - name: Move the pin everywhere and open a PR
        if: steps.resolve.outputs.status == 'behind'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.resolve.outputs.pin }}
          NEW: ${{ steps.resolve.outputs.new }}
        run: |
          set -euo pipefail
          BRANCH="bump/pipeline-action-${NEW:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # The SHA appears in ai-review.yml and in four places a reader copies
          # from — CONTRIBUTING.md and three pipeline READMEs. A bump that only
          # moved the first would leave the docs telling consumers to pin a
          # version the workflow no longer uses.
          MAPS=$(grep -rl "$OLD" . --include='*.yml' --include='*.md' || true)
          [ -n "$MAPS" ] || { echo "::error::pin $OLD not found anywhere"; exit 1; }
          echo "$MAPS" | xargs sed -i "s/$OLD/$NEW/g"
          git diff --stat

          git commit -am "chore: pipeline-action $NEW (was ${OLD:0:7})"
          git push -q origin "$BRANCH"

          body=$(cat <<'BODY'
          Automated daily bump, found by `bump-action-pin.yml`.

          The action is published by us, so a pin three weeks behind means this
          repository reviews itself with an older runtime than a consumer gets —
          the failure that reads as "the runtime is missing something".

          `smoke.yml` had been failing on this for three weeks without anyone
          reading it, which is the part worth fixing: the check existed, but
          nothing acted on it.

          This PR runs the full dogfooding suite against the new pin, so a bump
          that breaks the action turns this PR red instead of merging.
          BODY
          )

          gh pr create --head "$BRANCH" --base main \
            --title "chore: bump pipeline-action to ${NEW:0:7}" \
            --body "$body"
          # Merge only after this PR's own checks pass, which is the whole point:
          # the bump is verified by the same suite it changes. Falls back to a
          # human when auto-merge is off for the repository.
          gh pr merge --squash --auto --delete-branch \
            || echo "::warning::PR opened, but auto-merge is unavailable — merge it by hand"