# Reference consumer workflow — AI code review via agents-market pipelines.
# Doubles as this repo's dogfood run, so recommended and actual wiring cannot
# drift. The five decisions a naive wiring gets wrong, and why:
#
# 1. concurrency + cancel-in-progress, so four pushes do not leave four comment
#    sets. cancel-in-progress is pull_request-only: a cancelled required check
#    blocks its own merge.
# 2. One sticky comment per pipeline, upserted by HTML marker.
# 3. Inline threads are synced, not appended, so resolve work stays bounded.
# 4. Ephemeral agent identity, no AGENTSMARKET_PRIVATE_KEY. `init` mints a
#    throwaway key before any network call; only MINIMAX_API_KEY is needed.
# 5. Cost is labelled notional — local mode charges nothing, so bare, it reads
#    as an invoice.
#
# Traps and pinning rules: CONTRIBUTING.md.
name: AI Review

on:
  # Reusable: another repo calls this with
  #   uses: agents-market/github-workflows/.github/workflows/ai-review.yml@<sha>
  #   secrets: inherit
  # Pin the full commit SHA, per CONTRIBUTING.md — never a tag.
  workflow_call:
    inputs:
      pipeline_version:
        description: 'Pin both pipelines to this version. Unset installs whatever is current — right for repositories that own the pipelines and can fix one, wrong for repositories that want a PR check that does not move under them.'
        required: false
        type: string
      focus_area:
        description: 'Override focus_area for both pipelines. Leave unset to keep each pipeline own default.'
        required: false
        type: string
      severity:
        description: 'Override severity_threshold for both pipelines. Leave unset to keep each pipeline own default. The security audit defaults to medium and that is the floor to keep. The floor is a hint to the model, not a filter, so the sets are not nested: a higher floor is a different sample, not a subset.'
        required: false
        type: string
      advisory:
        description: >-
          '"true" reports findings but does not fail the job when a pipeline
          fails. Default false, so a broken review is a visible failure rather
          than a silently green check. Pass "true" only if a flaky model must
          not be allowed to block your PRs.'
        required: false
        type: string
        default: 'false'
      cli_version:
        description: >-
          'Install this CLI version instead of the newest. Unset installs the
          newest, which is the point of this run: a broken release turns the
          run red instead of reaching the pipelines unnoticed. Set it only to
          keep testing the pipelines while a release is broken.'
        required: false
        type: string
    secrets:
      MINIMAX_API_KEY:
        required: true
  pull_request:
    branches: [main]
  # Also run on pushes to main: a push used to produce a run with zero jobs, so a
  # broken ai-review.yml sat unnoticed three times in two days. A push reviews the
  # last commit, posts nothing, and fails loudly if the wiring is broken. Costs two
  # pipeline runs per push.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'Install this CLI version instead of the newest. Unset installs the newest.'
        required: false
        type: string

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: ${{ matrix.pipeline.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Compared against 'true', not 'false'. On pull_request and workflow_dispatch the
    # inputs context is empty, so `inputs.advisory` is '' — and `'' != 'false'` made
    # the dogfood run advisory, i.e. silently green. An unset input must mean strict.
    #
    # The exception is a push to main, where the commit is already merged and nothing
    # can be gated on it: a strict check there only produces a red nobody can act on,
    # and the model is intermittently unreliable, so a flaky model must not repaint
    # history. Wiring failures still fail the run — they happen in the install and
    # diff steps, which carry no exemption.
    continue-on-error: ${{ inputs.advisory == 'true' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        # Context is matrix.pipeline.*. An `include:` list with no base key
        # spreads flat, so matrix.pipeline resolves empty and every
        # ${{ matrix.pipeline.x }} renders as nothing.
        pipeline:
          - slug: code-review-security-audit
            version: ${{ inputs.pipeline_version }}
            focus_area: ${{ inputs.focus_area || 'security' }}
            severity: ${{ inputs.severity || 'medium' }}
            label: security audit
          - slug: style-review
            version: ${{ inputs.pipeline_version }}
            focus_area: ${{ inputs.focus_area || 'all' }}
            severity: ${{ inputs.severity || 'low' }}
            label: style review
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # node 22, not 20: openai@7.x declares engines.node >= 22 (EBADENGINE on 20)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install agentsmarket CLI
        # @latest, deliberately. We publish the CLI; a pin here means this
        # repository reviews itself with whatever shipped before the last thing.
        # smoke.yml keeps proving the floor still works — this is the other
        # half: if a new release breaks the run, our own PR review is what
        # says so, which is the entire reason to dogfood on latest.
        run: npm install -g @agentsmarket/cli@${{ inputs.cli_version || 'latest' }}

      - name: Mint throwaway agent identity
        run: |
          set -euo pipefail
          mkdir -p ~/.config/agentsmarket
          chmod 700 ~/.config/agentsmarket
          agentsmarket init
          chmod 600 ~/.config/agentsmarket/agent.key

      # No version by default. We publish the pipelines, we can publish a fix
      # within minutes, and a pin here means this repository reviews itself with
      # the release before the last one — which is how it sat on a CLI old
      # enough to ignore stage.maxTokens while the smoke test proved the next
      # one worked. Callers who want reproducibility pass pipeline_version.
      - name: Install pipeline from marketplace
        id: install
        env:
          SLUG: ${{ matrix.pipeline.slug }}
          VERSION: ${{ matrix.pipeline.version }}
        run: |
          set -euo pipefail
          # `if`, not `&&`: with `set -e` a false `&&` chain ends the step, and
          # an unpinned install is exactly the case where VERSION is empty.
          SPEC="$SLUG"
          if [ -n "$VERSION" ]; then SPEC="$SLUG@$VERSION"; fi
          agentsmarket pipeline install "$SPEC"
          # install writes <slug>@<resolved> even when no version was asked
          # for, and pipeline_file needs that concrete name. Read it back from
          # the lockfile rather than guessing.
          RESOLVED=$(python3 -c "
          import json
          lock = json.load(open('.agentsmarket/pipelines/pipeline.lock.yaml'))
          print(next(p['version'] for p in lock['pipelines'] if p['slug'] == '$SLUG'))
          ")
          echo "installed $SLUG@$RESOLVED"
          # A step output, not $GITHUB_ENV: the `env` context is not available in
          # a `uses:` step's `with:`. Reaching for it fails validation with zero
          # jobs, which is the failure mode this file warns about two steps
          # down and the one I walked into doing it.
          echo "path=.agentsmarket/pipelines/$SLUG@$RESOLVED/pipeline.yaml" >> "$GITHUB_OUTPUT"

      - name: Collect diff
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FOCUS: ${{ matrix.pipeline.focus_area }}
          SEVERITY: ${{ matrix.pipeline.severity }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE" "$HEAD" 2>/dev/null || true
          D=$(git diff --no-color "$BASE...$HEAD" 2>/dev/null || true)
          [ -n "$D" ] || D=$(git diff --no-color HEAD~1 HEAD 2>/dev/null || true)
          [ -n "$D" ] || D="(empty diff)"
          printf '%s' "${D:0:48000}" > /tmp/d.txt
          python3 -c "
          import json, os
          d = open('/tmp/d.txt', encoding='utf-8', errors='replace').read()
          p = {'code_diff': d, 'language': 'generic',
               'focus_area': os.environ['FOCUS'],
               'severity_threshold': os.environ['SEVERITY']}
          print('inputs_json=' + json.dumps(p))
          " >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        id: review
        # One flaky attempt must not fail the job when the retry recovers. Measured
        # live: a real `Output format violations` failure, the retry succeeded, and
        # the job still reported failure — a red check on a review that exists. The
        # retry below carries no such exemption, so two consecutive failures still
        # fail the job. That is the whole policy: absorb one, fail on two.
        continue-on-error: true
        # Two traps make this file fail with zero jobs and no useful message:
        #   - the `env` context is not available in a `uses:` step's `with:`, so a
        #     path has to travel as a step output
        #   - a top-level `env:` with nothing under it parses as `env: null` and is
        #     rejected outright; deleting a key from `env:` leaves the key behind
        #
        # A moving ref, on purpose. We publish this action, so a SHA pin means this
        # repository reviews itself with whatever shipped before the last thing —
        # which is how the pin went three weeks stale. A SHA here is also not
        # maintainable by a bot: GITHUB_TOKEN cannot push a commit that touches
        # .github/workflows/. Consumers still get a SHA, in CONTRIBUTING.md.
        uses: agents-market/pipeline-action@main
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          provider: minimax
          model: MiniMax-M3
          inputs_json: ${{ steps.diff.outputs.inputs_json }}
          pipeline_file: ${{ steps.install.outputs.path }}

      # One retry: the failure is stochastic and not ours to fix. Measured on this
      # pipeline, same diff, 20 runs: 3 failed, all on the model's JSON, never the
      # spec. `model_params.temperature` would be the lever and the runtime does not
      # read it; `output_retry: loop` is already the ceiling of three attempts. One
      # extra run costs ~0.01 USDC and about a minute.
      #
      # Downstream steps read `steps.review_retry.outputs.* || steps.review.outputs.*`,
      # so whichever attempt produced output is the one that gets posted.
      - name: Run pipeline (retry)
        id: review_retry
        # `always()` is load-bearing: on a pull request the job is strict, so a
        # failed first attempt makes GitHub skip every later step that has not
        # opted out of the implicit `success()` — including this one.
        if: always() && steps.review.outcome == 'failure'
        uses: agents-market/pipeline-action@main
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          provider: minimax
          model: MiniMax-M3
          inputs_json: ${{ steps.diff.outputs.inputs_json }}
          pipeline_file: ${{ steps.install.outputs.path }}

      # The exemption above is only safe if it is not silent. On a push there is no
      # PR to comment on, so the record goes in the job summary — a run that did not
      # complete says so, instead of reading green.
      - name: Record that the review did not complete
        # `always()` for the same reason as the retry above: this step exists to record
        # a failed review, so it runs exactly when the job is failing.
        if: always() && github.event_name == 'push' && steps.review.outcome == 'failure' && steps.review_retry.outcome != 'success'
        env:
          SLUG: ${{ matrix.pipeline.slug }}
        run: |
          {
            echo "### AI review did not complete"
            echo ""
            echo "The pipeline ran but returned no usable output. It does not gate"
            echo "this commit — it is already merged, and the model is intermittently"
            echo "unreliable on output format — but the review for \`$SLUG\` is"
            echo "**missing**, not clean."
          # `tee`, so the message is in the run log too. A summary-only write leaves
          # no trace where a reader looks first.
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The counts in the report are counted here, by code, from the same array
      # that produces the inline comments. Never by the model — a model that
      # counts a list it is writing gets it wrong, and we measured it: one run in
      # ten said "8 findings" over ten.
      #
      # `findings_skipped_no_metadata` is the other half. The action drops a
      # finding that has a line but no file, because the GitHub comments API
      # cannot resolve a path that is not one. It counted those drops and we
      # ignored the count, so a pipeline that returned five findings and lost
      # four of them reported "0 findings" and looked clean. Now the drop is
      # reported, loudly, because a finding nobody can see is not a finding.
      - name: Count findings (jq)
        id: count
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          FINDINGS: ${{ steps.review_retry.outputs.findings_json || steps.review.outputs.findings_json }}
          SKIPPED: ${{ steps.review_retry.outputs.findings_skipped_no_metadata || steps.review.outputs.findings_skipped_no_metadata }}
        run: |
          set -euo pipefail
          findings="${FINDINGS:-[]}"
          counts=$(printf '%s' "$findings" | jq -r '
            reduce (.[] | .severity) as $s
              ({"critical":0,"high":0,"medium":0,"low":0};
               .[$s] = ((.[$s] // 0) + 1))
            | to_entries | map("\(.key) \(.value)") | join(" · ")
          ')
          total=$(printf '%s' "$findings" | jq 'length')
          {
            echo "breakdown=$counts"
            echo "total=$total"
            echo "skipped=${SKIPPED:-0}"
          } >> "$GITHUB_OUTPUT"

      # The catalogue is not a file this repository owns — it travels inside the
      # pipeline, because a consumer who copies this file has no scripts/ and
      # no catalogue. The installed pipeline.yaml carries the same official
      # list the model was given, so the check reads it from there: one list,
      # two readers, nothing to drift.
      - name: Verify CWE ids against the published catalogue
        id: cwe
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          FINDINGS: ${{ steps.review_retry.outputs.findings_json || steps.review.outputs.findings_json }}
          PIPELINE_FILE: ${{ steps.install.outputs.path }}
        run: |
          set -euo pipefail
          printf '%s' "${FINDINGS:-[]}" > "$RUNNER_TEMP/findings.json"
          python3 - "$RUNNER_TEMP/findings.json" "$PIPELINE_FILE" > "$RUNNER_TEMP/cwe.json" <<'PY'
          import json, re, sys
          findings = json.load(open(sys.argv[1]))
          if isinstance(findings, dict):
              findings = findings.get("findings") or []
          # "CWE-89 — SQL Injection" lines: the catalogue the prompt carried.
          catalogue = {}
          date = ""
          try:
              for line in open(sys.argv[2], encoding="utf-8"):
                  m = re.match(r"^CWE catalogue — .*snapshot (\d{4}-\d{2}-\d{2}), (\d+) entries\.", line.strip())
                  if m:
                      date = m.group(1)
                  m = re.match(r"^(CWE-\d+) — (.+)$", line.strip())
                  if m:
                      catalogue[m.group(1).upper()] = m.group(2).strip()
          except FileNotFoundError:
              pass
          used, without_id = [], 0
          for f in findings:
              if not isinstance(f, dict):
                  continue
              cid = f.get("cwe") or f.get("cwe_id")
              if not cid:
                  without_id += 1
                  continue
              cid = str(cid).strip().upper()
              if cid not in used:
                  used.append(cid)
          verified, unknown = {}, []
          for cid in used:
              if cid in catalogue:
                  verified[cid] = {
                      "name": catalogue[cid],
                      "short": catalogue[cid],
                      "url": "https://cwe.mitre.org/data/definitions/%s.html" % cid.split("-")[1],
                  }
              else:
                  unknown.append(cid)
          json.dump({
              "source": "published catalogue" if catalogue else "none",
              "snapshot_date": date,
              "catalogue_size": len(catalogue),
              "used": used,
              "verified": verified,
              "unknown": unknown,
              "without_id": without_id,
          }, sys.stdout, ensure_ascii=False)
          PY
          echo "report=$(cat "$RUNNER_TEMP/cwe.json")" >> "$GITHUB_OUTPUT"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("  CWE: %d/%d confirmed against the %s (%s), not found: %s" % (len(r["verified"]), len(r["used"]), r["source"], r["snapshot_date"] or "no catalogue", r["unknown"]))' "$RUNNER_TEMP/cwe.json"

      - name: Upsert summary comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MARKER: ${{ matrix.pipeline.slug }}
          RESULT: ${{steps.review_retry.outputs.result_json || steps.review.outputs.result_json}}
          COST: ${{steps.review_retry.outputs.total_cost_usdc || steps.review.outputs.total_cost_usdc}}
          DURATION: ${{steps.review_retry.outputs.total_ms || steps.review.outputs.total_ms}}
          COUNTS: ${{ steps.count.outputs.breakdown || 'n/a' }}
          TOTAL: ${{ steps.count.outputs.total || '0' }}
          SKIPPED: ${{ steps.count.outputs.skipped || '0' }}
          CWE_REPORT: ${{ steps.cwe.outputs.report || '{}' }}
          RUN_STATUS: ${{steps.review_retry.outputs.status || steps.review.outputs.status}}
          FAILED_COUNT: ${{ steps.review_retry.outputs.failed_count || steps.review.outputs.failed_count || '0' }}
          MAX_SEVERITY: ${{ steps.review_retry.outputs.max_severity || steps.review.outputs.max_severity || '' }}
        with:
          script: |
            try {
              const marker = `<!-- am:${process.env.MARKER} -->`;
              const { data: prior } = await github.rest.issues.listComments({
                ...context.repo, issue_number: context.issue.number, per_page: 100,
              });
              const existing = prior.find(c => c.body && c.body.includes(marker));
              let b = marker + '\n';
              b += `## AI Review — ${process.env.MARKER}\n\n`;
              // `status` from the action is the GATE verdict, not the run status:
              // it reads "failed" when a finding is at or above the threshold.
              // Reading it as "the pipeline did not complete" put that sentence
              // on top of a review that had found eight real problems — the
              // alarm was crying wolf over the very findings it was reporting.
              // No result at all is what "did not complete" means.
              if (!process.env.RESULT) {
                b += `⚠️ Pipeline did not complete (\`${process.env.RUN_STATUS || 'no status'}\`). `;
                b += `See the [run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n`;
              } else {
                let cwe = {};
                try { cwe = JSON.parse(process.env.CWE_REPORT || '{}'); } catch {}
                b += `| Metric | Value |\n|---|---:|\n`;
                b += `| Duration | ${(Number(process.env.DURATION || 0) / 1000).toFixed(1)}s |\n`;
                b += `| Findings | ${process.env.TOTAL || '0'} (${process.env.COUNTS || 'n/a'}) |\n`;
                b += `| Market-equivalent cost | ${process.env.COST || '0'} USDC |\n`;
                if (process.env.RUN_STATUS === 'failed') {
                  const n = Number(process.env.FAILED_COUNT || 0);
                  b += `| Gate | failed — ${n} finding${n === 1 ? '' : 's'} at or above ${process.env.MAX_SEVERITY || 'the threshold'} |\n`;
                }
                const used = Array.isArray(cwe.used) ? cwe.used : [];
                if (used.length && cwe.source !== 'none') {
                  b += `| CWE codes | ${Object.keys(cwe.verified || {}).length}/${used.length} confirmed against the MITRE catalogue (snapshot ${cwe.snapshot_date || '?'}) |\n`;
                }
                b += `\n`;
                const skipped = Number(process.env.SKIPPED || 0);
                if (skipped > 0) {
                  b += `⚠️ **${skipped} finding(s) were dropped** for missing file metadata. `;
                  b += `They are not in the count above and not in the inline comments. `;
                  b += `This is a defect in the pipeline, not a clean result.\n\n`;
                }
                const unknown = Array.isArray(cwe.unknown) ? cwe.unknown : [];
                if (unknown.length) {
                  b += `⚠️ **Not in the published catalogue:** ${unknown.map(x => `\`${x}\``).join(', ')}. `;
                  b += `The model wrote these codes; they could not be confirmed and must not be cited.\n\n`;
                }
                b += `> Cost is a market-rate estimate of the tokens consumed. This pipeline `;
                b += `ran locally in the Actions runner — **nothing was charged**.\n\n`;
                let md = '';
                try {
                  const rec = JSON.parse(process.env.RESULT || '{}');
                  for (const v of Object.values(rec)) {
                    try {
                      const o = JSON.parse(v);
                      if (o && typeof o.markdown_report === 'string') md = o.markdown_report;
                    } catch {}
                  }
                } catch {}
                b += md ? md.slice(0, 8000) + '\n'
                        : '_This pipeline emits no narrative report — see inline comments._\n';
              }
              if (existing) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body: b });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: b });
              }
            } catch (e) {
              core.setFailed(`summary comment: ${e.message}`);
            }

      - name: Sync inline review threads
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FINDINGS: ${{steps.review_retry.outputs.findings_json || steps.review.outputs.findings_json}}
          MARKER: ${{ matrix.pipeline.slug }}
          CWE_REPORT: ${{ steps.cwe.outputs.report || '{}' }}
        with:
          script: |
            // Own threads via a body marker, never by actor login: REST calls the
            // Actions bot `github-actions[bot]`, GraphQL calls it `github-actions`, so a
            // login test matches nothing and every finding is re-posted. The marker also
            // keeps each matrix job off the other pipeline's threads.
            const MARK = `<!-- am:${process.env.MARKER} -->`;
            try {
              let findings = [];
              try { findings = JSON.parse(process.env.FINDINGS || '[]'); } catch {}
              let cwe = {};
              try { cwe = JSON.parse(process.env.CWE_REPORT || '{}'); } catch {}
              const verified = cwe.verified || {};
              const valid = findings.filter(f =>
                f && typeof f.file === 'string' && f.file.length > 0
                && Number.isFinite(f.line) && f.line > 0);

              const q = await github.graphql(`
                query($owner:String!,$repo:String!,$number:Int!){
                  repository(owner:$owner,name:$repo){
                    pullRequest(number:$number){
                      reviewThreads(first:100){
                        nodes{ id isResolved isOutdated path line
                               comments(first:10){ totalCount nodes{ id databaseId body } } }
                      } } } }`,
                { owner: context.repo.owner, repo: context.repo.repo, number: context.issue.number });
              if (!q || !q.repository) throw new Error('graphql returned no repository — nothing to sync');
              const threads = q.repository.pullRequest.reviewThreads.nodes;
              const ours = threads.filter(t => {
                const first = t.comments.nodes[0];
                return first && typeof first.body === 'string' && first.body.includes(MARK);
              });
              // Live comments of this pipeline, keyed by where they stand. One
              // place can hold several comments — two weaknesses of one class
              // in one file are two comments — so the key holds a list, and a
              // comment of another class on a line never hides a finding.
              const live = new Map();
              for (const t of ours) {
                if (t.isResolved || t.isOutdated) continue;
                const k = `${t.path}:${t.line}`;
                const list = live.get(k) || [];
                list.push(t);
                live.set(k, list);
              }
              const liveCount = () => {
                let n = 0;
                for (const list of live.values()) n += list.length;
                return n;
              };
              const forget = (t) => {
                const k = `${t.path}:${t.line}`;
                const list = live.get(k) || [];
                const i = list.findIndex(x => x.id === t.id);
                if (i >= 0) list.splice(i, 1);
                if (!list.length) live.delete(k);
              };

              const { data: files } = await github.rest.pulls.listFiles({
                ...context.repo, pull_number: context.issue.number, per_page: 100,
              });
              const inDiff = new Set(files.map(f => f.filename));

              let resolved = 0, replaced = 0;
              // One comment per (file, class). The model's line for a weakness
              // is not stable — the same weakness comes back on a neighbouring
              // line, sometimes fourteen lines away — and the comment key is
              // path:line, so every run added fresh comments and the fixture's
              // pull request collected 52 of them for the 11 planted
              // weaknesses. The class is the CWE id, or the category tag the
              // style pipeline opens its description with ("[types] ...").
              // Same class only: two different weaknesses of one class can
              // share a file, and the surviving comment still names the class
              // and the file.
              // Two ids that name one weakness are one weakness. The
              // catalogue carries both (CWE-330 and CWE-338 both describe a
              // random number that is not random), so the model picks either
              // from run to run: the run of 2026-10-22 called the same
              // Math.random token CWE-330 and then CWE-338, and the comment
              // for the first id never closed. The reader saw the weakness
              // twice. The map is the shortcut — it covers the pairs the
              // catalogue offers for one weakness, not every future id.
              const CANON = { 'CWE-330': 'CWE-338', 'CWE-259': 'CWE-798' };
              const canon = (id) => {
                const u = String(id || '').trim().toUpperCase();
                return CANON[u] || u;
              };
              const classOfText = (text) => {
                const c = /CWE-\d+/i.exec(String(text || ''));
                if (c) return canon(c[0]);
                const v = /CVE-\d{4}-\d+/i.exec(String(text || ''));
                if (v) return v[0].toUpperCase();
                // The category tag the style pipeline opens its description
                // with. Anchored at the start: a bracket in the middle of a
                // sentence is prose, not a class.
                const b2 = /^\s*\[([a-z][a-z_]{1,24})\]/i.exec(String(text || ''));
                return b2 ? b2[1].toUpperCase() : null;
              };
              // What the body carries wins: it is written by this step, so it is
              // exact. The text is the fallback for threads posted before the
              // class marker existed.
              const classOfBody = (body) => {
                const m = /<!--\s*am:class:([a-z0-9_-]+)\s*-->/i.exec(String(body || ''));
                return m ? m[1].toUpperCase() : classOfText(body);
              };
              const resolveThread = async (t) => {
                await github.graphql(
                  `mutation($id:ID!){ resolveReviewThread(input:{threadId:$id}){ thread{ isResolved } } }`,
                  { id: t.id });
                forget(t);
                resolved++;
              };
              // The token may not be allowed to close a thread — the run of
              // 2026-10-22 showed the default GITHUB_TOKEN refused to resolve
              // with "Resource not accessible by integration", while a personal
              // token closed the same threads. A thread that cannot be closed
              // stays as it is, and the fresh comment for that class is not
              // posted: a standing comment the reader can see beats two they
              // cannot. But a comment that can go must go, or the review keeps
              // claiming weaknesses that were fixed days ago.
              const closeThread = async (t) => {
                const first = t.comments.nodes[0];
                let why = '';
                // A thread with replies is a conversation: never delete it,
                // only resolve it.
                if (first && (t.comments.totalCount || 0) === 1) {
                  try {
                    // The REST call wants the numeric comment id, not the
                    // GraphQL node id — the node id is a 404 here.
                    await github.rest.pulls.deleteReviewComment({
                      ...context.repo, comment_id: first.databaseId,
                    });
                    forget(t);
                    replaced++;
                    return true;
                  } catch (e) { why = `delete: ${e.message}`; }
                }
                try { await resolveThread(t); return true; }
                catch (e) {
                  core.warning(`cannot close a duplicate at ${t.path}:${t.line} — ${e.message}${why ? `; ${why}` : ''}`);
                  return false;
                }
              };
              const byClass = new Map();
              for (const t of ours) {
                if (t.isResolved || t.isOutdated || !inDiff.has(t.path)) continue;
                const cls = classOfBody(t.comments.nodes[0] && t.comments.nodes[0].body);
                if (!cls) continue;
                const key = `${t.path}::${cls}`;
                const list = byClass.get(key) || [];
                list.push(t);
                byClass.set(key, list);
              }

              // A thread whose file left the diff or whose line moved on says
              // nothing about the code any more.
              for (const t of ours) {
                if (!t.isResolved && (t.isOutdated || !inDiff.has(t.path))) {
                  await closeThread(t);
                }
              }

              const emoji = { critical: '🔴', high: '🟠', medium: '🟡', low: '🔵' };
              let posted = 0, skipped = 0;
              const closedIds = new Set();
              for (const f of valid) {
                if (!inDiff.has(f.file)) { skipped++; continue; }
                // Close what this class already carries on this file, then post
                // the fresh one on the line the model gives this time. If
                // closing is not allowed, the standing comment stays and no
                // second one is added.
                const cls = canon(f.cwe) || classOfText(f.message);
                const dupes = cls ? (byClass.get(`${f.file}::${cls}`) || []) : [];
                let closed = true;
                for (const t of dupes) {
                  if (closedIds.has(t.id)) continue;
                  if (await closeThread(t)) closedIds.add(t.id);
                  else closed = false;
                }
                const key = `${f.file}:${f.line}`;
                const here = live.get(key) || [];
                // A comment of another class on this line is a different
                // weakness and must not hide this finding: the run of
                // 2026-10-22 lost the SSRF finding because a comment of
                // another class stood on the same line. A comment of this
                // class was closed above; a comment with no class cannot be
                // told apart from this finding, so it stays and nothing is
                // added.
                const hidden = cls
                  ? here.some(t => classOfBody(t.comments.nodes[0] && t.comments.nodes[0].body) === cls)
                  : here.length > 0;
                if (hidden || (dupes.length && !closed)) { skipped++; continue; }
                let b = `${MARK}\n${emoji[f.severity] || '⚪'} **${String(f.severity || 'unknown').toUpperCase()}**`;
                if (f.cwe) {
                  const id = String(f.cwe).trim().toUpperCase();
                  const v = verified[id];
                  b += ` \`${id}\``;
                  // The id is only worth printing if it was checked against the
                  // official catalogue; an unchecked code is worse than none.
                  b += v ? ` — [${v.short || v.name}](${v.url})` : ' — not in the published catalogue';
                }
                // The class tag is how the next run recognises this comment as
                // the same weakness; it is a hidden marker, not reader text.
                if (cls) b += `\n<!-- am:class:${cls} -->`;
                const msg = String(f.message || '').replace(/^\s*\[[a-z][a-z_]{1,24}\]\s*/i, '');
                b += ` (conf ${Math.round((f.confidence || 0) * 100)}%): ${msg}`;
                if (f.recommendation) b += `\n\n💡 ${f.recommendation}`;
                try {
                  await github.rest.pulls.createReviewComment({
                    ...context.repo, pull_number: context.issue.number,
                    commit_id: context.payload.pull_request.head.sha,
                    path: f.file, line: f.line, side: 'RIGHT', body: b,
                  });
                  posted++;
                  live.set(key, [...here, { id: `new-${posted}`, path: f.file,
                    line: f.line, comments: { nodes: [{ body: b }] } }]);
                } catch (e) {
                  core.warning(`inline skip ${key}: ${e.message}`);
                }
              }
              core.info(`threads(${process.env.MARKER}) — ${posted} posted, ${resolved} resolved, ${replaced} replaced, ${liveCount()} live, ${skipped} suppressed`);
            } catch (e) {
              core.warning(`thread sync FAILED — inline threads not synced: ${e.message}`);
              await core.summary.addHeading('Inline thread sync failed', 3)
                .addRaw(e.message).write();
            }