# Reference consumer workflow — AI code review via agents-market pipelines.
# Doubles as this repo's dogfood run, so recommended and actual wiring cannot
# drift. Five decisions, each fixing a defect seen on web3eco/blockchain PR #83;
# a naive wiring gets all five wrong. Traps and pinning rules: CONTRIBUTING.md.
#
# 1. concurrency + cancel-in-progress — a naive trigger re-runs on every
#    `synchronize`, so four pushes = four duplicate comment sets. Grouping by PR
#    number makes a new commit supersede the in-flight run. cancel-in-progress
#    is pull_request-only: a cancelled required check blocks its own merge.
# 2. One sticky comment per pipeline, upserted by HTML marker, not per run.
# 3. Inline threads are synced, not appended — an already-reported finding is
#    not re-posted and a stale anchor is auto-resolved, so resolve work is bounded.
# 4. Ephemeral agent identity, no AGENTSMARKET_PRIVATE_KEY. `pipeline install`
#    needs an EIP-191 signature but no registration, balance, or funded account,
#    and `init` mints a throwaway key before any network call. Only
#    MINIMAX_API_KEY is needed — the private key is for remote executor_url runs.
# 5. Cost is labelled notional — total_cost_usdc is a market-rate estimate and
#    local mode charges nothing, so bare, it reads as an invoice.
name: AI Review

on:
  # Reusable: another repo calls this with
  #   uses: agents-market/github-workflows/.github/workflows/ai-review.yml@<sha>
  #   secrets: inherit
  # Pin the full commit SHA, per CONTRIBUTING.md — never a tag.
  workflow_call:
    inputs:
      pipeline_version:
        description: 'Pin both pipelines to this version. Unset installs whatever is current — right for repositories that own the pipelines and can fix one, wrong for repositories that want a PR check that does not move under them.'
        required: false
        type: string
      focus_area:
        description: 'Override focus_area for both pipelines. Leave unset to keep each pipeline own default.'
        required: false
        type: string
      severity:
        description: 'Override severity_threshold for both pipelines. Leave unset to keep each pipeline own default.'
        required: false
        type: string
      advisory:
        description: >-
          '"true" reports findings but does not fail the job when a pipeline
          fails. Default false, so a broken review is a visible failure rather
          than a silently green check. Pass "true" only if a flaky model must
          not be allowed to block your PRs.'
        required: false
        type: string
        default: 'false'
    secrets:
      MINIMAX_API_KEY:
        required: true
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  CLI_VERSION: '0.12.4'   # must be >= the smoke test's pin; the guard in smoke.yml
                           # fails if dogfooding trails what we have proven works

jobs:
  review:
    name: ${{ matrix.pipeline.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Compared against 'true', not 'false'. On pull_request and workflow_dispatch
    # the inputs context is empty, so `inputs.advisory` is '' — and `'' != 'false'`
    # made the dogfood run advisory, i.e. silently green. An unset input must
    # mean strict; only an explicit 'true' may downgrade a failure to a warning.
    continue-on-error: ${{ inputs.advisory == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Context is matrix.pipeline.*. An `include:` list with no base key
        # spreads flat, so matrix.pipeline resolves empty and every
        # ${{ matrix.pipeline.x }} renders as nothing.
        pipeline:
          - slug: code-review-security-audit
            version: ${{ inputs.pipeline_version }}
            focus_area: ${{ inputs.focus_area || 'security' }}
            severity: ${{ inputs.severity || 'medium' }}
            label: security audit
          - slug: style-review
            version: ${{ inputs.pipeline_version }}
            focus_area: ${{ inputs.focus_area || 'all' }}
            severity: ${{ inputs.severity || 'low' }}
            label: style review
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # node 22, not 20: openai@7.x declares engines.node >= 22 (EBADENGINE on 20)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install agentsmarket CLI
        run: npm install -g @agentsmarket/cli@${{ env.CLI_VERSION }}

      - name: Mint throwaway agent identity
        run: |
          set -euo pipefail
          mkdir -p ~/.config/agentsmarket
          chmod 700 ~/.config/agentsmarket
          agentsmarket init
          chmod 600 ~/.config/agentsmarket/agent.key

      # No version by default. We publish the pipelines, we can publish a fix
      # within minutes, and a pin here means this repository reviews itself with
      # the release before the last one — which is how it sat on a CLI old
      # enough to ignore stage.maxTokens while the smoke test proved the next
      # one worked. Callers who want reproducibility pass pipeline_version.
      - name: Install pipeline from marketplace
        env:
          SLUG: ${{ matrix.pipeline.slug }}
          VERSION: ${{ matrix.pipeline.version }}
        run: |
          set -euo pipefail
          SPEC="$SLUG"
          [ -n "$VERSION" ] && SPEC="$SLUG@$VERSION"
          agentsmarket pipeline install "$SPEC"
          # install writes <slug>@<resolved> even when no version was asked
          # for, and pipeline_file needs that concrete name. Read it back from
          # the lockfile rather than guessing.
          RESOLVED=$(python3 -c "
          import json
          lock = json.load(open('.agentsmarket/pipelines/pipeline.lock.yaml'))
          print(next(p['version'] for p in lock['pipelines'] if p['slug'] == '$SLUG'))
          ")
          echo "installed $SLUG@$RESOLVED"
          echo "PIPELINE_FILE=.agentsmarket/pipelines/$SLUG@$RESOLVED/pipeline.yaml" >> "$GITHUB_ENV"

      - name: Collect diff
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FOCUS: ${{ matrix.pipeline.focus_area }}
          SEVERITY: ${{ matrix.pipeline.severity }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE" "$HEAD" 2>/dev/null || true
          D=$(git diff --no-color "$BASE...$HEAD" 2>/dev/null || true)
          [ -n "$D" ] || D=$(git diff --no-color HEAD~1 HEAD 2>/dev/null || true)
          [ -n "$D" ] || D="(empty diff)"
          printf '%s' "${D:0:48000}" > /tmp/d.txt
          python3 -c "
          import json, os
          d = open('/tmp/d.txt', encoding='utf-8', errors='replace').read()
          p = {'code_diff': d, 'language': 'generic',
               'focus_area': os.environ['FOCUS'],
               'severity_threshold': os.environ['SEVERITY']}
          print('inputs_json=' + json.dumps(p))
          " >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        id: review
        # SHA inlined: `env` is invalid in `uses:` — fails validation with 0 jobs.
        uses: agents-market/pipeline-action@0ed368079a4ebf4e5272bc1694cffedc26d59cc6 # v0.4.3
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          provider: minimax
          model: MiniMax-M3
          inputs_json: ${{ steps.diff.outputs.inputs_json }}
          pipeline_file: ${{ env.PIPELINE_FILE }}

      - name: Upsert summary comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MARKER: ${{ matrix.pipeline.slug }}
          RESULT: ${{ steps.review.outputs.result_json }}
          COST: ${{ steps.review.outputs.total_cost_usdc }}
          DURATION: ${{ steps.review.outputs.total_ms }}
          COUNTS: ${{ steps.review.outputs.findings_count_json }}
          RUN_STATUS: ${{ steps.review.outputs.status }}
        with:
          script: |
            try {
              const marker = `<!-- am:${process.env.MARKER} -->`;
              const { data: prior } = await github.rest.issues.listComments({
                ...context.repo, issue_number: context.issue.number, per_page: 100,
              });
              const existing = prior.find(c => c.body && c.body.includes(marker));
              let b = marker + '\n';
              b += `## AI Review — ${process.env.MARKER}\n\n`;
              if (process.env.RUN_STATUS !== 'passed' || !process.env.RESULT) {
                b += `⚠️ Pipeline did not complete (\`${process.env.RUN_STATUS || 'no status'}\`). `;
                b += `See the [run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n`;
              } else {
                b += `| Metric | Value |\n|---|---:|\n`;
                b += `| Duration | ${(Number(process.env.DURATION || 0) / 1000).toFixed(1)}s |\n`;
                b += `| Findings | ${process.env.COUNTS || 'n/a'} |\n`;
                b += `| Market-equivalent cost | ${process.env.COST || '0'} USDC |\n\n`;
                b += `> Cost is a market-rate estimate of the tokens consumed. This pipeline `;
                b += `ran locally in the Actions runner — **nothing was charged**.\n\n`;
                let md = '';
                try {
                  const rec = JSON.parse(process.env.RESULT || '{}');
                  for (const v of Object.values(rec)) {
                    try {
                      const o = JSON.parse(v);
                      if (o && typeof o.markdown_report === 'string') md = o.markdown_report;
                    } catch {}
                  }
                } catch {}
                b += md ? md.slice(0, 8000) + '\n'
                        : '_This pipeline emits no narrative report — see inline comments._\n';
              }
              if (existing) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body: b });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: b });
              }
            } catch (e) {
              core.setFailed(`summary comment: ${e.message}`);
            }

      - name: Sync inline review threads
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          FINDINGS: ${{ steps.review.outputs.findings_json }}
          MARKER: ${{ matrix.pipeline.slug }}
        with:
          script: |
            // Own threads via a body marker, never by actor login: REST calls the
            // Actions bot `github-actions[bot]`, GraphQL calls it `github-actions`, so a
            // login test matches nothing and every finding is re-posted. The marker also
            // keeps each matrix job off the other pipeline's threads.
            const MARK = `<!-- am:${process.env.MARKER} -->`;
            try {
              let findings = [];
              try { findings = JSON.parse(process.env.FINDINGS || '[]'); } catch {}
              const valid = findings.filter(f =>
                f && typeof f.file === 'string' && f.file.length > 0
                && Number.isFinite(f.line) && f.line > 0);

              const q = await github.graphql(`
                query($owner:String!,$repo:String!,$number:Int!){
                  repository(owner:$owner,name:$repo){
                    pullRequest(number:$number){
                      reviewThreads(first:100){
                        nodes{ id isResolved isOutdated path line
                               comments(first:1){ nodes{ body } } }
                      } } } }`,
                { owner: context.repo.owner, repo: context.repo.repo, number: context.issue.number });
              if (!q || !q.repository) throw new Error('graphql returned no repository — nothing to sync');
              const threads = q.repository.pullRequest.reviewThreads.nodes;
              const ours = threads.filter(t => {
                const first = t.comments.nodes[0];
                return first && typeof first.body === 'string' && first.body.includes(MARK);
              });
              const live = new Set(ours.filter(t => !t.isResolved && !t.isOutdated)
                .map(t => `${t.path}:${t.line}`));

              const { data: files } = await github.rest.pulls.listFiles({
                ...context.repo, pull_number: context.issue.number, per_page: 100,
              });
              const inDiff = new Set(files.map(f => f.filename));

              let resolved = 0;
              for (const t of ours) {
                if (!t.isResolved && (t.isOutdated || !inDiff.has(t.path))) {
                  await github.graphql(
                    `mutation($id:ID!){ resolveReviewThread(input:{threadId:$id}){ thread{ isResolved } } }`,
                    { id: t.id });
                  resolved++;
                }
              }

              const emoji = { critical: '🔴', high: '🟠', medium: '🟡', low: '🔵' };
              let posted = 0, skipped = 0;
              for (const f of valid) {
                const key = `${f.file}:${f.line}`;
                if (live.has(key) || !inDiff.has(f.file)) { skipped++; continue; }
                let b = `${MARK}\n${emoji[f.severity] || '⚪'} **${String(f.severity || 'unknown').toUpperCase()}**`;
                if (f.cwe) b += ` \`${f.cwe}\``;
                b += ` (conf ${Math.round((f.confidence || 0) * 100)}%): ${f.message || ''}`;
                if (f.recommendation) b += `\n\n💡 ${f.recommendation}`;
                try {
                  await github.rest.pulls.createReviewComment({
                    ...context.repo, pull_number: context.issue.number,
                    commit_id: context.payload.pull_request.head.sha,
                    path: f.file, line: f.line, side: 'RIGHT', body: b,
                  });
                  posted++; live.add(key);
                } catch (e) {
                  core.warning(`inline skip ${key}: ${e.message}`);
                }
              }
              core.info(`threads(${process.env.MARKER}) — ${posted} posted, ${resolved} resolved, ${live.size} live, ${skipped} suppressed`);
            } catch (e) {
              core.warning(`thread sync FAILED — inline threads not synced: ${e.message}`);
              await core.summary.addHeading('Inline thread sync failed', 3)
                .addRaw(e.message).write();
            }